# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: skillrank1
# "app" enables Serverless Framework Dashboard features and sharing them with other Services.
app: workbridge
# "service" is the name of this project. This will also be added to your AWS resource names.
service: workbridge

useDotenv: true

provider:
  name: aws
  runtime: python3.14
  region: eu-west-2
  architecture: arm64
  stage: ${opt:stage, 'dev'}
  httpApi:
    cors:
      allowedOrigins:
        - http://localhost:3000
        - http://localhost:5173
        - http://127.0.0.1:5173
        - http://localhost:5174
        - http://127.0.0.1:5174
        - https://main.d1za2x0uapsxam.amplifyapp.com
      allowedHeaders:
        - Content-Type
        - Authorization
        - X-Api-Key
        - X-Jira-Email
        - X-Jira-Api-Token
        - X-Jira-Base-Url
      allowedMethods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      allowCredentials: true
      maxAge: 86400
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:DeleteItem
            - dynamodb:UpdateItem
          Resource:
            - !GetAtt ConnectionsTable.Arn
  environment:
    STAGE: ${sls:stage}
    CONNECTIONS_TABLE: workbridge-${sls:stage}-connections
    JIRA_OAUTH_CLIENT_ID: ${env:JIRA_OAUTH_CLIENT_ID, ''}
    JIRA_OAUTH_CLIENT_SECRET: ${env:JIRA_OAUTH_CLIENT_SECRET, ''}
    OAUTH_REDIRECT_BASE: ${env:OAUTH_REDIRECT_BASE, ''}
    WEB_APP_URL: ${env:WEB_APP_URL, 'http://localhost:5173'}
    STANDUP_PROJECT_KEY: ${env:STANDUP_PROJECT_KEY, ''}
    SLACK_OAUTH_CLIENT_ID: ${env:SLACK_OAUTH_CLIENT_ID, ''}
    SLACK_OAUTH_CLIENT_SECRET: ${env:SLACK_OAUTH_CLIENT_SECRET, ''}
    SLACK_REDIRECT_URI: ${env:SLACK_REDIRECT_URI, ''}
    SLACK_BOT_TOKEN: ${env:SLACK_BOT_TOKEN, ssm:/workbridge/${sls:stage}/slack-bot-token}
    SLACK_CHANNEL_ID: ${env:SLACK_CHANNEL_ID, ssm:/workbridge/${sls:stage}/slack-channel-id}
    SLACK_PREP_USER_IDS: ${env:SLACK_PREP_USER_IDS, ''}
    OPENAI_API_KEY: ${env:OPENAI_API_KEY, ''}
    OPENAI_MODEL: ${env:OPENAI_MODEL, 'gpt-4o-mini'}
    OPENAI_BASE_URL: ${env:OPENAI_BASE_URL, 'https://api.openai.com/v1'}
    GROQ_API_KEY: ${env:GROQ_API_KEY, ''}
    GROQ_MODEL: ${env:GROQ_MODEL, 'llama-3.1-8b-instant'}
    GROQ_BASE_URL: ${env:GROQ_BASE_URL, 'https://api.groq.com/openai/v1'}
    GEMINI_API_KEY: ${env:GEMINI_API_KEY, ''}
    GEMINI_MODEL: ${env:GEMINI_MODEL, 'gemini-2.0-flash'}

layers:
  requestsDependency:
    path: layers/requestsDependency
    name: ${self:service}-${sls:stage}-requests
    description: Dependencies for requests
    compatibleRuntimes:
      - python3.14
    compatibleArchitectures:
      - arm64

  pydanticDependency:
    path: layers/pydanticDependency
    name: ${self:service}-${sls:stage}-pydantic
    description: Dependencies for pydantic
    compatibleRuntimes:
      - python3.14
    compatibleArchitectures:
      - arm64

  certifiDependency:
    path: layers/certifiDependency
    name: ${self:service}-${sls:stage}-certifi
    description: Dependencies for certifi
    compatibleRuntimes:
      - python3.14
    compatibleArchitectures:
      - arm64

  slackSdkDependency:
    path: layers/slackSdkDependency
    name: ${self:service}-${sls:stage}-slack-sdk
    description: Dependencies for slack-sdk
    compatibleRuntimes:
      - python3.14
    compatibleArchitectures:
      - arm64

  pythonDotenvDependency:
    path: layers/pythonDotenvDependency
    name: ${self:service}-${sls:stage}-python-dotenv
    description: Dependencies for python-dotenv
    compatibleRuntimes:
      - python3.14
    compatibleArchitectures:
      - arm64

functions:
  health:
    handler: src/api/health.handler
    layers: &commonLayers
      - !Ref RequestsDependencyLambdaLayer
      - !Ref PydanticDependencyLambdaLayer
      - !Ref CertifiDependencyLambdaLayer
      - !Ref SlackSdkDependencyLambdaLayer
      - !Ref PythonDotenvDependencyLambdaLayer
    events:
      - httpApi:
          path: /health
          method: get

  listProjects:
    handler: src/api/list_projects.handler
    layers: *commonLayers
    events:
      - httpApi:
          path: /jira/projects
          method: get

  listIssues:
    handler: src/api/list_issues.handler
    layers: *commonLayers
    events:
      - httpApi:
          path: /jira/projects/{projectKey}/issues
          method: get

  getIssue:
    handler: src/api/get_issue.handler
    layers: *commonLayers
    events:
      - httpApi:
          path: /jira/issues/{issueKey}
          method: get

  standup:
    handler: src/api/standup.handler
    timeout: 20
    layers: *commonLayers
    events:
      - httpApi:
          path: /jira/projects/{projectKey}/standup
          method: get

  postStandup:
    handler: src/api/post_standup.handler
    timeout: 20
    layers: *commonLayers
    events:
      - httpApi:
          path: /jira/projects/{projectKey}/standup
          method: post
      - schedule:
          method: scheduler
          name: workbridge-${sls:stage}-daily-standup
          description: Post Jira standup to Slack weekdays at 09:00 London
          rate: cron(0 9 ? * MON-FRI *)
          timezone: Europe/London
          enabled: false

  prepStandup:
    handler: src/api/prep_standup.handler
    timeout: 30
    layers: *commonLayers
    events:
      - httpApi:
          path: /standup/prep
          method: post
      - schedule:
          method: scheduler
          name: workbridge-${sls:stage}-dsu-prep
          description: DM each assignee a DSU prep brief weekdays at 09:50 London
          rate: cron(50 9 ? * MON-FRI *)
          timezone: Europe/London
          enabled: true

  oauthJiraStart:
    handler: src/api/oauth_jira_start.handler
    layers: *commonLayers
    events:
      - httpApi:
          path: /oauth/jira/start
          method: get

  oauthJiraCallback:
    handler: src/api/oauth_jira_callback.handler
    layers: *commonLayers
    events:
      - httpApi:
          path: /oauth/jira/callback
          method: get

  oauthSlackStart:
    handler: src/api/oauth_slack_start.handler
    layers: *commonLayers
    events:
      - httpApi:
          path: /oauth/slack/start
          method: get

  oauthSlackCallback:
    handler: src/api/oauth_slack_callback.handler
    layers: *commonLayers
    events:
      - httpApi:
          path: /oauth/slack/callback
          method: get

  oauthStatus:
    handler: src/api/oauth_status.handler
    layers: *commonLayers
    events:
      - httpApi:
          path: /oauth/status
          method: get

  oauthDisconnect:
    handler: src/api/oauth_disconnect.handler
    layers: *commonLayers
    events:
      - httpApi:
          path: /oauth/disconnect
          method: post

  saveWorkspace:
    handler: src/api/save_workspace.handler
    layers: *commonLayers
    events:
      - httpApi:
          path: /workspace
          method: post

custom:
  scripts:
    hooks:
      before:package:initialize: chmod +x ./installLayers.sh && ./installLayers.sh

plugins:
  - serverless-offline

resources:
  Resources:
    ConnectionsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: workbridge-${sls:stage}-connections
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: pk
            AttributeType: S
        KeySchema:
          - AttributeName: pk
            KeyType: HASH

